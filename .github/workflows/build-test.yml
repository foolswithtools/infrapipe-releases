# Builds all four image variants from a release's binaries and runs the smoke test, WITHOUT
# pushing anything or touching any tag. Use it to test a change to the Dockerfile or to
# scripts/smoke.sh from a branch, or before merging a tool-version bump.
name: build-test
on:
  pull_request:
    paths:
      - Dockerfile
      - scripts/smoke.sh
      - .github/workflows/build-test.yml
  workflow_dispatch:
    inputs:
      tag:
        description: Release whose linux binaries to use (bare, e.g. 0.0.140); default is the latest
        required: false
permissions:
  contents: read
jobs:
  build-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { variant: core,   target: core }
          - { variant: aws,    target: aws }
          - { variant: pulumi, target: pulumi-cli }
          - { variant: azure,  target: azure }
    env:
      TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Resolve the release whose binaries are used
        run: |
          set -euo pipefail
          if [ -z "${TAG:-}" ]; then
            TAG="$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1 --json tagName --jq '.[0].tagName')"
          fi
          case "$TAG" in (*[!0-9.]*|"") echo "tag must be digits and dots, got '$TAG'"; exit 1;; esac
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "using binaries from release $TAG"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Fetch and verify the linux binaries
        run: |
          set -euo pipefail
          mkdir -p bin
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir bin \
            -p 'infrapipe-linux-amd64' -p 'infrapipe-linux-amd64.sha256' \
            -p 'infrapipe-linux-arm64' -p 'infrapipe-linux-arm64.sha256'
          cd bin
          for f in infrapipe-linux-amd64 infrapipe-linux-arm64; do
            [ "$(awk '{print $1}' $f.sha256)" = "$(sha256sum $f | awk '{print $1}')" ] || { echo "CHECKSUM MISMATCH $f"; exit 1; }
          done
          rm -f *.sha256
          chmod 0755 infrapipe-linux-*
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build (amd64, load only; nothing is pushed)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64
          load: true
          push: false
          tags: build-test:${{ matrix.variant }}
          provenance: false
          sbom: false
      - name: Smoke test
        run: bash scripts/smoke.sh "build-test:${{ matrix.variant }}" "${{ matrix.variant }}"
