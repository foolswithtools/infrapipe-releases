# Signs a promoted release's binaries and checksum files with cosign (keyless, GitHub OIDC),
# generates and signs an SBOM per binary, and uploads the signatures and SBOMs to the release.
#
# Trigger: manually (workflow_dispatch) with the release tag, from main only. Runs in the
# protected `release` environment. The signing identity is therefore always this file at
# refs/heads/main. There is no long-lived signing key.
#
# Safety: every binary is re-verified against its .sha256 sidecar (produced by the private build)
# and the job fails, signing nothing, on any mismatch. Existing signature assets are never replaced.
name: sign-release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to sign (bare, e.g. 0.0.133)
        required: true
permissions:
  contents: write   # upload signature/SBOM assets to the release
  id-token: write   # keyless signing (OIDC)
jobs:
  sign:
    runs-on: ubuntu-latest
    environment: release
    env:
      TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Only from main
        run: |
          [ "$GITHUB_REF" = "refs/heads/main" ] || { echo "must run from main"; exit 1; }
          case "$TAG" in (*[!0-9.]*|"") echo "tag must be digits and dots"; exit 1;; esac
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
      - name: Download release assets
        run: |
          mkdir assets
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir assets
          ls -l assets
      - name: Re-verify every binary against its checksum
        working-directory: assets
        run: |
          set -eu
          n=0
          for f in infrapipe-*; do
            case "$f" in *.sha256|*.sigstore.json|*.spdx.json) continue;; esac
            [ -f "$f.sha256" ] || { echo "missing checksum for $f"; exit 1; }
            exp=$(awk '{print $1}' "$f.sha256")
            act=$(sha256sum "$f" | awk '{print $1}')
            [ "$exp" = "$act" ] || { echo "CHECKSUM MISMATCH: $f"; exit 1; }
            n=$((n+1))
          done
          [ "$n" -ge 5 ] || { echo "expected 5 binaries, found $n"; exit 1; }
          echo "verified $n binaries"
      - name: SBOM per binary
        working-directory: assets
        run: |
          set -eu
          for f in infrapipe-*; do
            case "$f" in *.sha256|*.sigstore.json|*.spdx.json) continue;; esac
            syft scan "file:$f" -o "spdx-json=$f.spdx.json"
          done
      - name: Sign binaries, checksum files and SBOMs (keyless)
        working-directory: assets
        run: |
          set -eu
          for f in infrapipe-*; do
            case "$f" in *.sigstore.json) continue;; esac
            cosign sign-blob --yes --bundle "$f.sigstore.json" "$f" >/dev/null
          done
          ls -l *.sigstore.json | wc -l
      - name: Upload signatures and SBOMs (never overwrite)
        working-directory: assets
        run: |
          set -eu
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" *.sigstore.json *.spdx.json
