name: scrub-check
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  scrub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: No internal identifiers in published docs
        run: |
          mkdir -p /tmp/stage
          cp -R README.md docs install.sh /tmp/stage/
          sh scripts/scrub-check.sh /tmp/stage
