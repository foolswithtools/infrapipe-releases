# Builds, tests, signs and publishes the container images for a promoted release, from the
# released (checksum-verified) binaries. Triggered manually from main in the `release`
# environment. Images: ghcr.io/foolswithtools/infrapipe[:X.Y.Z | :latest | :X.Y.Z-aws | ...].
name: image
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build images for (bare, e.g. 0.0.133)
        required: true
permissions:
  contents: read
  packages: write   # push to ghcr.io/foolswithtools/*
  id-token: write   # keyless signing (OIDC)
jobs:
  image:
    runs-on: ubuntu-latest
    environment: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - { variant: core,   target: core,       suffix: "",        floating: latest }
          - { variant: aws,    target: aws,        suffix: "-aws",    floating: aws }
          - { variant: pulumi, target: pulumi-cli, suffix: "-pulumi", floating: pulumi }
          - { variant: azure,  target: azure,      suffix: "-azure",  floating: azure }
    env:
      TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ github.token }}
      IMAGE: ghcr.io/foolswithtools/infrapipe
    steps:
      - name: Only from main
        run: |
          [ "$GITHUB_REF" = "refs/heads/main" ] || { echo "must run from main"; exit 1; }
          case "$TAG" in (*[!0-9.]*|"") echo "tag must be digits and dots"; exit 1;; esac
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Fetch and verify the linux binaries
        run: |
          set -eu
          mkdir -p bin
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir bin \
            -p 'infrapipe-linux-amd64' -p 'infrapipe-linux-amd64.sha256' \
            -p 'infrapipe-linux-arm64' -p 'infrapipe-linux-arm64.sha256'
          cd bin
          for f in infrapipe-linux-amd64 infrapipe-linux-arm64; do
            [ "$(awk '{print $1}' $f.sha256)" = "$(sha256sum $f | awk '{print $1}')" ] || { echo "CHECKSUM MISMATCH $f"; exit 1; }
          done
          rm -f *.sha256
          chmod 0755 infrapipe-linux-*
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build (amd64, load) for smoke test
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64
          load: true
          tags: smoke:${{ matrix.variant }}
          provenance: false
          sbom: false
      - name: Smoke test
        run: |
          set -eu
          img=smoke:${{ matrix.variant }}
          docker run --rm "$img" version
          docker run --rm --entrypoint tofu "$img" version
          docker run --rm --entrypoint git "$img" --version
          case "${{ matrix.variant }}" in
            aws)    docker run --rm --entrypoint aws "$img" --version ;;
            azure)  docker run --rm --entrypoint az "$img" version ;;
            pulumi) docker run --rm --entrypoint pulumi "$img" version ;;
          esac
          [ "$(docker run --rm --entrypoint id "$img" -u)" = "10001" ] || { echo "not running as 10001"; exit 1; }
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push (multi-arch)
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ inputs.tag }}${{ matrix.suffix }}
            ${{ env.IMAGE }}:${{ matrix.floating }}
          provenance: false
          sbom: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
      - name: SBOM, then sign image and attach SBOM attestation (keyless, by digest)
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -eu
          ref="$IMAGE@$DIGEST"
          syft scan "registry:$ref" -o spdx-json=sbom.spdx.json
          cosign sign --yes "$ref"
          cosign attest --yes --type spdxjson --predicate sbom.spdx.json "$ref"
          echo "signed $ref"
